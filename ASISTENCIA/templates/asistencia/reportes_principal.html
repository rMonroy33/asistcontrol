{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'asistencia/css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'asistencia/css/reportes.css' %}">
    <title>Reportes - Sistema de Asistencia</title>
</head>
<body>
    <div class="container">
        <h1>Reportes</h1>

        <!-- Navegación -->
        <div class="navigation">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'alumnosGet' %}">Alumnos</a>
            <a href="{% url 'asistenciasGet' %}">Asistencias</a>
        </div>

        <!-- Descripción del módulo -->
        <div class="module-description">
            <p>Crear una página principal con opciones para seleccionar el tipo de reporte deseado (Diario, Semanal, Mensual).</p>
        </div>

        <!-- Opciones de reportes -->
        <div class="reports-grid">
            <!-- Reporte Diario -->
            <div class="report-card">
                <h3>Reporte Diario</h3>
                <a href="{% url 'reporte_diario' %}" class="btn-primary">Acceder</a>
            </div>

            <!-- Reporte Semanal -->
            <div class="report-card">
                <h3>Reporte Semanal</h3>
                <a href="{% url 'reporte_semanal' %}" class="btn-primary">Acceder</a>
            </div>

            <!-- Reporte Mensual -->
            <div class="report-card">
                <h3>Reporte Mensual</h3>
                <a href="{% url 'reporte_mensual' %}" class="btn-primary">Acceder</a>
            </div>
        </div>
    </div>

    
</body>
</html>
